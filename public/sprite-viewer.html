<!DOCTYPE html>
<html>
<head>
  <title>Sprite Sheet Viewer</title>
  <style>
    body { margin: 0; padding: 20px; background: #1a1a1a; color: #fff; font-family: monospace; }
    .info { margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; background: #000; padding: 10px; }
    .frame { background: #333; display: flex; align-items: center; justify-content: center; aspect-ratio: 16/9; font-size: 10px; overflow: hidden; }
    .row-label { position: absolute; left: 0; padding: 10px; background: #222; }
    .frame img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="info">
    <h2>Creature Animation Sprite Sheet</h2>
    <p>60 frames (12 per animation × 5 animations)</p>
    <p>Each frame: 1280×720px</p>
  </div>
  
  <h3>Row 1: IDLE (12 frames)</h3>
  <div class="grid" id="idle"></div>
  
  <h3>Row 2: WALK LEFT (12 frames)</h3>
  <div class="grid" id="walkLeft"></div>
  
  <h3>Row 3: WALK RIGHT (12 frames)</h3>
  <div class="grid" id="walkRight"></div>
  
  <h3>Row 4: ATTACK (12 frames)</h3>
  <div class="grid" id="attack"></div>
  
  <h3>Row 5: CASTING (12 frames)</h3>
  <div class="grid" id="casting"></div>

  <script>
    const frameWidth = 1280;
    const frameHeight = 720;
    const sheetUrl = '/spritesheet.png';
    
    const animations = [
      { name: 'idle', frames: 12, container: 'idle', startFrame: 0 },
      { name: 'walkLeft', frames: 12, container: 'walkLeft', startFrame: 12 },
      { name: 'walkRight', frames: 12, container: 'walkRight', startFrame: 24 },
      { name: 'attack', frames: 12, container: 'attack', startFrame: 36 },
      { name: 'casting', frames: 12, container: 'casting', startFrame: 48 }
    ];

    animations.forEach(anim => {
      const container = document.getElementById(anim.container);
      for (let i = 0; i < anim.frames; i++) {
        const frameNum = anim.startFrame + i;
        const col = frameNum % 12;
        const row = Math.floor(frameNum / 12);
        
        const frame = document.createElement('div');
        frame.className = 'frame';
        frame.title = `Frame ${frameNum + 1}`;
        
        const canvas = document.createElement('canvas');
        canvas.width = frameWidth;
        canvas.height = frameHeight;
        
        const img = new Image();
        img.src = sheetUrl;
        img.onload = () => {
          const ctx = canvas.getContext('2d');
          ctx.drawImage(
            img,
            col * frameWidth, row * frameHeight, frameWidth, frameHeight,
            0, 0, frameWidth, frameHeight
          );
          frame.appendChild(canvas);
        };
        
        container.appendChild(frame);
      }
    });
  </script>
</body>
</html>
