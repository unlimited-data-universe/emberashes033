<!DOCTYPE html>
<html>
<head>
  <title>Sprite Sheet Viewer</title>
  <style>
    body { margin: 0; padding: 20px; background: #1a1a1a; color: #fff; font-family: monospace; }
    .info { margin-bottom: 20px; }
    .grid { display: grid; gap: 2px; background: #000; padding: 10px; }
    .frame { background: #333; display: flex; align-items: center; justify-content: center; aspect-ratio: 16/9; font-size: 10px; overflow: hidden; }
    .frame img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="info">
    <h2>Creature Animation Sprite Sheet</h2>
    <p id="summary">Loading spritesheet.json…</p>
  </div>
  <div id="rows"></div>

  <script>
    const sheetUrl = '/spritesheet.png';

    fetch('/spritesheet.json').then(r => r.json()).then(manifest => {
      const { frameWidth, frameHeight, width, animations } = manifest;
      const cols = width / frameWidth;
      const names = Object.keys(animations);
      const totalFrames = names.reduce((sum, n) => sum + animations[n].frames, 0);
      document.getElementById('summary').textContent =
        `${totalFrames} frames across ${names.length} animations. Each cell: ${frameWidth}×${frameHeight}px. Atlas grid: ${cols} cols.`;

      const rowsEl = document.getElementById('rows');
      names.forEach(name => {
        const anim = animations[name];
        const heading = document.createElement('h3');
        heading.textContent = `Row ${anim.row + 1}: ${name.toUpperCase()} (${anim.frames} frames)`;
        rowsEl.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.style.gridTemplateColumns = `repeat(${anim.frames}, 1fr)`;
        rowsEl.appendChild(grid);

        anim.frameIndices.forEach((flatIndex, i) => {
          const col = flatIndex % cols;
          const row = Math.floor(flatIndex / cols);

          const frame = document.createElement('div');
          frame.className = 'frame';
          frame.title = `${name} frame ${i + 1} (atlas col ${col}, row ${row})`;

          const canvas = document.createElement('canvas');
          canvas.width = frameWidth;
          canvas.height = frameHeight;

          const img = new Image();
          img.src = sheetUrl;
          img.onload = () => {
            const ctx = canvas.getContext('2d');
            ctx.drawImage(
              img,
              col * frameWidth, row * frameHeight, frameWidth, frameHeight,
              0, 0, frameWidth, frameHeight
            );
            frame.appendChild(canvas);
          };

          grid.appendChild(frame);
        });
      });
    });
  </script>
</body>
</html>
